<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="vAxIgene: epitope-based vaccine design workspace (input, pipeline and results dashboard).">
<title>vAxIgene Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  --canvas:#f2f4f8; --panel:#ffffff; --panel2:#eef1f7; --ink:#121826; --muted:#566075; --line:#d9dee8;
  --accent:#4a3aa7; --accentink:#ffffff; --accent-soft:#e9e6f8;
  --good:#0a7a0a; --good-soft:#e1f3e1; --warn:#8a5600; --warn-soft:#fdf0d4; --crit:#b32d2d;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --shadow:0 1px 2px rgba(18,24,38,.06),0 8px 24px rgba(18,24,38,.06);
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0d111b; --panel:#141a28; --panel2:#1b2335; --ink:#e8ecf5; --muted:#93a0b8; --line:#26304a;
  --accent:#9085e9; --accentink:#10102a; --accent-soft:#25264a;
  --good:#5fd05f; --good-soft:#15301a; --warn:#f0b43c; --warn-soft:#38290c; --crit:#ec7a7a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#0d111b; --panel:#141a28; --panel2:#1b2335; --ink:#e8ecf5; --muted:#93a0b8; --line:#26304a;
  --accent:#9085e9; --accentink:#10102a; --accent-soft:#25264a;
  --good:#5fd05f; --good-soft:#15301a; --warn:#f0b43c; --warn-soft:#38290c; --crit:#ec7a7a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
html,body{background:var(--canvas);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
*{box-sizing:border-box}
.display{font-family:var(--font-display);font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.tabular{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:62ch;font-size:16px}
.text-accent{color:var(--accent)} .text-warn{color:var(--warn)}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--canvas) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{height:34px;width:auto;border-radius:9px;display:block;flex:none}
.hero-logo{width:100%;max-height:200px;object-fit:cover;object-position:center 62%;border-radius:16px;display:block;border:1px solid var(--line)}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accentink);display:grid;place-items:center;flex:none}
.brand-name{font-size:20px;white-space:nowrap}
.brand-name b{color:var(--accent);font-weight:700}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--panel2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{color:var(--ink)}
.tab-on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.tab-short{display:none}
.tab-st{margin-left:2px;color:var(--accent)}
.tab-done{width:16px;height:16px;border-radius:50%;background:var(--good);color:var(--panel);display:inline-grid;place-items:center}
.tab-new{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--panel2)}
.main{max-width:1240px;margin:0 auto;padding:28px 16px 64px}
.view{animation:viewIn .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:900px){.brand-sub{display:none}}
@media (max-width:720px){
  .topbar-in{gap:8px}.brand-name{display:none}
  .tabs{flex:1;margin-left:0}.tab{flex:1;justify-content:center;padding:7px 6px;font-size:13px}
  .tab-label{display:none}.tab-short{display:inline}
}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid transparent;transition:background .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accentink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:var(--panel2)}
.btn-sm{padding:6px 12px;font-size:13px}

.step-card{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.step-ico{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.last-run{display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;width:100%;padding:16px 18px;border-radius:14px;border:1px dashed var(--line);background:var(--panel);color:var(--ink);transition:border-color .2s}
.last-run:hover{border-color:var(--accent)}
.ribbon{display:flex;flex-wrap:wrap;gap:1px;font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--muted);max-height:4.6em;overflow:hidden;letter-spacing:.06em;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent);mask-image:linear-gradient(90deg,#000 55%,transparent)}
.ribbon span{opacity:.25;animation:ribbon 3.6s ease-in-out infinite}
@keyframes ribbon{0%,100%{opacity:.25}50%{opacity:1;color:var(--accent)}}

.test-banner{background:#e0524f;color:#fff;text-align:center;font-weight:600;padding:12px;border-radius:14px 14px 0 0;font-size:14px}
.form-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px;box-shadow:var(--shadow)}
.label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-bottom:6px}
.req{color:var(--crit)}
.field{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--canvas);color:var(--ink);font-size:14px;transition:border-color .15s,box-shadow .15s}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.field{resize:vertical;min-height:84px}
select.field{appearance:none;-webkit-appearance:none;padding-right:36px}
.select-wrap{position:relative}
.select-caret{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);display:grid}
.form-err{display:flex;align-items:center;gap:6px;margin-top:12px;color:var(--crit);font-size:13px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:16px}
.tile{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}
.tile-v{font-size:30px;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.pill-good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.note-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:13px}
.note-bar svg{flex:none;color:var(--accent)}

.attn{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.attn li{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--panel2)}
.attn-ico{flex:none;margin-top:1px}
.attn-warn .attn-ico{color:var(--warn)}.attn-info .attn-ico{color:var(--accent)}
.attn-warn{border-left:3px solid var(--warn)}.attn-info{border-left:3px solid var(--accent)}

/* pipeline */
.lane{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.lane-dim{opacity:.6;border-style:dashed}
.lane-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.lane-swatch{width:6px;align-self:stretch;min-height:34px;border-radius:3px;flex:none}
.lane-track{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0}
.conn{width:14px;height:2px;background:var(--line);flex:none;transition:background .3s}
.conn-on{background:var(--good)}
.node{position:relative;display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--canvas);font-size:12.5px;font-weight:500;overflow:hidden;transition:background .25s,border-color .25s,color .25s}
.node-label{position:relative;z-index:1}
.node-dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.node-ico{display:grid;flex:none;position:relative;z-index:1}
.node-pending,.node-off{color:var(--muted)}
.node-running{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.node-running .node-ico{color:var(--accent)}
.node-done{border-color:color-mix(in srgb,var(--good) 55%,var(--line));color:var(--ink)}
.node-done .node-ico{color:var(--good)}
.node-skipped{border-style:dashed;border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.node-off{border-style:dashed}
.node-tag{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:5px;background:var(--panel2);color:var(--muted);position:relative;z-index:1}
.node-skipped .node-tag{background:transparent;color:var(--warn)}
.node-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .1s linear}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.meter{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .15s linear}
.stages{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.stage{display:flex;align-items:center;gap:10px;color:var(--muted)}
.stage-mark{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--panel)}
.stage-running{color:var(--ink);font-weight:600}.stage-running .stage-mark{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stage-done{color:var(--ink)}.stage-done .stage-mark{background:var(--good);border-color:var(--good)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:12.5px;font-weight:500}
.chip:hover:not(:disabled){background:var(--panel2)}
.chip-on{background:var(--accent);border-color:var(--accent);color:var(--accentink)}
.chip-on:hover:not(:disabled){background:var(--accent)!important}
.log-panel{display:flex;flex-direction:column;gap:10px}
.log{max-height:280px;overflow-y:auto;display:grid;gap:6px;font-size:12px;align-content:start}
.log-line{display:flex;gap:8px}.log-t{color:var(--muted);font-family:var(--font-mono);flex:none;width:40px}
.log-skipped .log-m{color:var(--warn)}
.done-banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.done-banner>svg{color:var(--good)}

/* results */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.sw-solid{background:var(--ink)}.sw-light{background:var(--ink);opacity:.3}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%}
.dot-fill{background:var(--ink)}.dot-ring{border:2.5px solid var(--ink);background:var(--panel)}
.chart-read{margin-top:12px;font-size:13px;color:var(--muted);min-height:20px}
.funnel{display:grid;gap:4px;margin-top:14px}
.funnel-head,.funnel-row{display:grid;grid-template-columns:130px minmax(0,1fr) 80px;gap:14px;align-items:center}
.funnel-head{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:0 8px}
.funnel-row{padding:7px 8px;border-radius:9px;font-size:13px;outline:none}
.funnel-row.on,.funnel-row:focus-visible{background:var(--panel2)}
.funnel-bars{position:relative;height:22px;display:block}
.fbar{position:absolute;left:0;top:0;height:22px;border-radius:0 4px 4px 0}
.fbar-top{top:6px;height:10px}
.fval{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:12px;background:var(--panel);padding:0 4px;border-radius:4px}
.funnel-row.on .fval{background:var(--panel2)}
@media (max-width:560px){.funnel-head,.funnel-row{grid-template-columns:92px minmax(0,1fr) 44px;gap:8px}.funnel-head span:nth-child(3){font-size:10px}}
.scroll-x{overflow-x:auto}
.map-svg{width:100%;min-width:640px;height:auto;display:block}
.grid-line{stroke:var(--line);stroke-width:1}
.axis-line{stroke:var(--muted);stroke-width:1}
.ax-text{fill:var(--muted);font-size:12px;font-family:var(--font-mono)}
.row-text{fill:var(--ink);font-size:12.5px;font-family:var(--font-body)}
.mark{cursor:pointer;transition:r .12s}
.stack{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden}
.stack>span{min-width:3px}.stack-sm{height:14px}
.seqbox{margin-top:14px;padding:14px;border-radius:12px;background:var(--panel2);font-size:13.5px;line-height:2;word-break:break-all;display:flex;flex-wrap:wrap;gap:3px 2px}
.seg{padding:0 3px;border-radius:4px;border-bottom:3px solid transparent;cursor:default;transition:background .12s}
.seg-adj{border-color:var(--accent)}.seg-htl{border-color:var(--s2)}.seg-bc{border-color:var(--s4)}.seg-ifn{border-color:var(--s3)}
.seg-ctl{border-color:var(--s1)}
.ctl-block{margin-bottom:6px}
.seg-lnk{color:var(--muted)}
.seg.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl th.text-right{text-align:right}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:0;margin:0}
.kv dt,.kv dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv dt{color:var(--muted)}.kv dd{text-align:right}
.dock{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:12px;background:var(--panel2);color:var(--ink);text-decoration:none;border:1px solid transparent}
.dock:hover{border-color:var(--accent)}


.form-card{position:relative;overflow:hidden;background-image:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--s3) 14%,transparent),transparent 45%),radial-gradient(circle at 0 100%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 45%),radial-gradient(color-mix(in srgb,var(--muted) 22%,transparent) 1px,transparent 1.5px);background-size:auto,auto,18px 18px}
.form-card>*{position:relative}
.form-top{display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.helix{width:96px;height:46px;flex:none;overflow:visible}
.helix-a,.helix-b{fill:none;stroke-width:2.5;stroke-linecap:round}
.helix-a{stroke:var(--s1)}.helix-b{stroke:var(--accent)}
.helix-rung{stroke-width:2;stroke-linecap:round}
.helix{animation:helixDrift 6s ease-in-out infinite}
@keyframes helixDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.bio-tag{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);letter-spacing:.02em}
.form-foot{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:20px;padding-top:14px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.form-foot span{display:inline-flex;align-items:center;gap:6px}
.form-foot .dot{width:8px;height:8px}

/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--canvas) 78%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:viewIn .2s both}
.overlay-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:340px;box-shadow:var(--shadow);text-align:center}
.overlay-spin{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto}
.overlay-steps{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px;text-align:left;font-size:14px}
.ostep{display:flex;align-items:center;gap:10px;color:var(--muted)}
.ostep-ico{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--panel);flex:none}
.ostep-run{color:var(--ink)}.ostep-run .ostep-ico{border-color:var(--accent)}
.ostep-done{color:var(--ink)}.ostep-done .ostep-ico{background:var(--good);border-color:var(--good)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
tailwind.config={corePlugins:{preflight:true},theme:{extend:{colors:{canvas:'var(--canvas)',panel:'var(--panel)',panel2:'var(--panel2)',ink:'var(--ink)',muted:'var(--muted)',line:'var(--line)',accent:'var(--accent)',accentink:'var(--accentink)',good:'var(--good)',warn:'var(--warn)',crit:'var(--crit)'},fontFamily:{display:['var(--font-display)'],sans:['var(--font-body)'],mono:['var(--font-mono)']}}}};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide-react@0.468.0/dist/umd/lucide-react.min.js"></script>
</head>
<body>

function chain(start, items) {
  const out = [];
  let cursor = start, prevStart = start;
  items.forEach(function (it) {
    const o = it[4] || {};
    const s = o.same ? prevStart : cursor;
    const node = { id: it[0], label: it[1], s: s, d: it[2], detail: it[3] || '', skip: !!o.skip, off: !!o.off };
    prevStart = s;
    if (!o.skip) cursor = Math.max(cursor, s + it[2]);
    out.push(node);
  });
  return out;
}

function nodeState(n, t) {
  if (n.off) return 'off';
  if (n.skip) return t >= n.s ? 'skipped' : 'pending';
  if (t >= n.s + n.d) return 'done';
  if (t >= n.s) return 'running';
  return 'pending';
}

function buildLog(t, query) {
  const ev = [];
  LANES.forEach(function (l) {
    l.nodes.forEach(function (n) {
      if (n.off) return;
      const st = nodeState(n, t);
      if (st === 'done' || st === 'skipped') {
        const detail = n.id === 'form' ? 'Query: ' + (query || DEMO.query) : n.detail;
        ev.push({ at: n.s + n.d, st: st, text: n.label + (detail ? ' · ' + detail : '') });
      }
    });
  });
  ev.sort(function (a, b) { return a.at - b.at; });
  return ev.slice(-14);
}

function copyText(text, done) {
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta); done(ok);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
  } else { fallback(); }
}

function Helix() {
  const W = 120, H = 56, n = 14, a = [], b = [], rungs = [];
  for (let i = 0; i <= 60; i++) {
    const x = (i / 60) * W, ph = (i / 60) * Math.PI * 4;
    a.push((i ? 'L' : 'M') + x.toFixed(1) + ' ' + (H / 2 + Math.sin(ph) * 20).toFixed(1));
    b.push((i ? 'L' : 'M') + x.toFixed(1) + ' ' + (H / 2 - Math.sin(ph) * 20).toFixed(1));
  }
  for (let i = 0; i <= n; i++) {
    const x = (i / n) * W, ph = (i / n) * Math.PI * 4, y = Math.sin(ph) * 20;
    rungs.push(h('line', { key: i, x1: x, x2: x, y1: H / 2 + y, y2: H / 2 - y, className: 'helix-rung', style: { stroke: i % 2 ? 'var(--s3)' : 'var(--s4)', opacity: Math.abs(Math.cos(ph)) * 0.8 + 0.1 } }));
  }
  return h('svg', { className: 'helix', viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': true },
    rungs,
    h('path', { d: a.join(' '), className: 'helix-a' }),
    h('path', { d: b.join(' '), className: 'helix-b' }));
}

function EpitopeMap() {

    { id: 'ifn', label: 'IFN-γ', k: 'ifn', bars: DATA.tracks.ifn, mark: 'ifn' },
    { id: 'bcl', label: 'B · linear', k: 'bc', bars: DATA.tracks.bc },
    { id: 'bcs', label: 'B · surface', k: 'bc', bars: DATA.tracks.sa },
    { id: 'bca', label: 'B · antigenic', k: 'bc', bars: DATA.tracks.an },
    { id: 'bcm', label: 'B · selected', k: 'bc', mark: 'bc' }

            }) : null,

        h('text', { x: L + plotW, y: H - 8, textAnchor: 'end', className: 'ax-text' }, ''))),
    h('div', { className: 'legend mt-2' },
      h('span', null, h('i', { className: 'sw sw-solid', style: { background: 'var(--ink)' } }), 'Bars: regions passing the score filter'),

function CtlConstruct() {

  const segs = CTL_SEGS.map(function (s, i) { const start = pos + 1; pos += s[1].length; return { k: s[0], seq: s[1], start: start, end: pos, i: i }; });
  function copy() { copyText(CTL_CONSTRUCT, function (ok) { setCopied(ok ? 'Copied' : 'Select the sequence to copy'); setTimeout(function () { setCopied(''); }, 2000); }); }

    h('div', { className: 'flex flex-wrap items-center justify-between gap-3' },
      h('div', { className: 'min-w-0' },

}

        })))));
}

function Section(props) {

  const attention = [

    { tone: 'info', t: 'Input-sequence properties look truncated', d: 'The first physicochemical table reports 9 residues (1,145 Da), not 1,300. Check the "Sequence as Amino Acid Only" step. Half-life and instability index are blank in both tables.' }
  ];

      h('div', { className: 'flex flex-wrap gap-2' },

        h(Pill, { tone: 'warn', icon: ['TriangleAlert', 'AlertTriangle'] }, '1 node not executed'))),
    h('p', { className: 'note-bar' }, h(Icon, { n: 'Info', size: 15 }),
      fresh ? 'Fresh run for "' + (run.query || '') + '". This prototype always shows the saved report for ' + REPORT.id + '.' : 'Showing the saved report for ' + REPORT.id + '. Submit a query from Data Input to simulate a new run.'),
    h('div', { className: 'grid gap-3 sm:grid-cols-2 xl:grid-cols-4' },
      h(Tile, { k: 'Construct', v: '270 aa', sub: '28.56 kDa · pI 8.19' }),
      h(Tile, { k: 'Epitopes selected', v: '20', sub: '5 CTL · 5 HTL · 5 B-cell · 5 IFN-γ' }),
      h(Tile, { k: 'Solubility', v: 'Insoluble', sub: 'Model probability 0.77', pill: h(Pill, { tone: 'warn', icon: ['TriangleAlert', 'AlertTriangle'] }, 'Needs attention') }),
      h(Tile, { k: 'TLR docking', v: '2 jobs', sub: 'TLR2 and TLR4, GRAMM-X' })),
    h(Section, { title: 'Needs attention', note: 'Read from the report as generated.' },
      h('ul', { className: 'attn' }, attention.map(function (a) {
        return h('li', { key: a.t, className: 'attn-' + a.tone },
          h('span', { className: 'attn-ico' }, h(Icon, { n: a.tone === 'warn' ? ['TriangleAlert', 'AlertTriangle'] : 'Info', size: 16 })),
          h('div', { className: 'min-w-0' }, h('div', { className: 'font-semibold' }, a.t), h('div', { className: 'muted text-sm mt-0.5' }, a.d)));
      }))),
    h(Section, { title: 'Candidates by pathway', note: 'How many epitope candidates survived each filter.' }, h(Funnel, null)),
    h(Section, { title: 'Epitope map', note: 'Where candidate regions and chosen epitopes sit along the conserved region.' }, h(EpitopeMap, null)),
    h(Section, { title: 'Vaccine constructs', note: 'The MHC-I (CTL) construct and the final vaccine construct, as built in the report.' }, h(CtlConstruct, null), h(ConstructView, null)),
    h('div', { className: 'grid gap-6 lg:grid-cols-2' },
      h(Section, { title: 'Physicochemical properties', note: 'Whole 270-aa construct.' },
        h('dl', { className: 'kv' },

            return h(React.Fragment, { key: r[0] }, h('dt', null, r[0]), h('dd', { className: 'mono tabular' + (r[1] === 'not reported' ? ' muted' : '') }, r[1]));

          h('div', { className: 'legend mt-2' },
            h('span', null, h('i', { className: 'sw sw-solid', style: { background: 'var(--s2)' } }), 'Negative ', h('b', { className: 'mono' }, 23)),

/* ====================================================================== APP */
const TABS = [
  { id: 'input', label: 'Data Input', short: 'Input', icon: ['ClipboardList'] },
  { id: 'pipeline', label: 'Pipeline Execution', short: 'Pipeline', icon: ['Workflow'] },
  { id: 'results', label: 'Results & Analytics', short: 'Results', icon: ['ChartColumn', 'BarChart3'] }
];

function App() {
  const [tab, setTab] = useState('input');
  const [form, setForm] = useState({ type: '', query: '' });
  const [overlay, setOverlay] = useState(0);
  const [autoGo, setAutoGo] = useState(false);
  const [theme, setTheme] = useState(function () {
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { return 'light'; }
  });
  const [run, setRun] = useState({ phase: 'idle', t: 0, speed: 2, paused: false, fresh: false, query: '' });
  const mainRef = useRef(null);

  useEffect(function () { document.documentElement.setAttribute('data-theme', theme); }, [theme]);

  useEffect(function () {
    if (run.phase !== 'running' || run.paused) return;
    const id = setInterval(function () {
      setRun(function (r) {
        if (r.phase !== 'running') return r;
        const t = r.t + 0.1 * r.speed;
        if (t >= TOTAL) return Object.assign({}, r, { t: TOTAL, phase: 'done', fresh: true });
        return Object.assign({}, r, { t: t });
      });
    }, 100);
    return function () { clearInterval(id); };
  }, [run.phase, run.paused, run.speed]);

  useEffect(function () {
    if (run.phase === 'done' && autoGo && tab === 'pipeline') {
      const id = setTimeout(function () { setTab('results'); setAutoGo(false); }, 3200);
      return function () { clearTimeout(id); };
    }
  }, [run.phase, autoGo, tab]);

  useEffect(function () { window.scrollTo(0, 0); }, [tab]);

  function startRun(q) {
    setRun({ phase: 'running', t: 0, speed: 2, paused: false, fresh: false, query: q });
    setAutoGo(true);
    setTab('pipeline');
  }
  function submit() {
    setOverlay(1);
    setTimeout(function () { setOverlay(2); }, 600);
    setTimeout(function () { setOverlay(3); }, 1150);
    setTimeout(function () { setOverlay(0); startRun(form.query.trim().slice(0, 80)); }, 1700);
  }
  function startDemo() { setForm({ type: DEMO.type, query: DEMO.query }); startRun(DEMO.query); }

  const status = {
    input: run.phase !== 'idle' ? 'done' : '',
    pipeline: run.phase === 'running' ? 'running' : run.phase === 'done' ? 'done' : '',
    results: run.phase === 'done' && tab !== 'results' ? 'new' : ''
  };

  let view;
  if (tab === 'input') view = h(InputView, { form: form, setForm: setForm, onSubmit: submit, go: setTab });
  else if (tab === 'pipeline') view = h(PipelineView, {
    run: run, autoGo: autoGo, go: setTab, startDemo: startDemo,
    cancelAuto: function () { setAutoGo(false); },
    setSpeed: function (s) { setRun(function (r) { return Object.assign({}, r, { speed: s }); }); },
    togglePause: function () { setRun(function (r) { return Object.assign({}, r, { paused: !r.paused }); }); },
    skip: function () { setRun(function (r) { return Object.assign({}, r, { t: TOTAL, phase: 'done', fresh: true }); }); },
    replay: function () { setRun(function (r) { return Object.assign({}, r, { phase: 'running', t: 0, paused: false, fresh: false }); }); setAutoGo(true); }
  });
  else view = h(ResultsView, { run: run });

  const steps = ['Validating input', 'Creating execution', 'Opening pipeline'];

  return h('div', { className: 'app' },
    h('header', { className: 'topbar' },
      h('div', { className: 'topbar-in' },
        h('div', { className: 'brand' },
          h('img', { className: 'brand-logo', src: LOGO_MARK, alt: 'vAxIgene' }),
          h('span', { className: 'brand-sub' }, 'Epitope vaccine design')),
        h('nav', { className: 'tabs', role: 'tablist', 'aria-label': 'Workflow views' },
          TABS.map(function (tb, i) {
            const st = status[tb.id];
            return h('button', { key: tb.id, role: 'tab', type: 'button', 'aria-selected': tab === tb.id, className: 'tab' + (tab === tb.id ? ' tab-on' : ''), onClick: function () { setTab(tb.id); } },
              h(Icon, { n: tb.icon, size: 16 }),
              h('span', { className: 'tab-label' }, tb.label),
              h('span', { className: 'tab-short' }, tb.short),
              st === 'running' ? h(Icon, { n: ['LoaderCircle', 'Loader2'], size: 13, className: 'spin tab-st' }) : st === 'done' ? h('span', { className: 'tab-st tab-done' }, h(Icon, { n: 'Check', size: 11, sw: 3 })) : st === 'new' ? h('span', { className: 'tab-new' }) : null);
          })),
        h('button', { type: 'button', className: 'icon-btn', 'aria-label': theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme', onClick: function () { setTheme(theme === 'dark' ? 'light' : 'dark'); } },
          h(Icon, { n: theme === 'dark' ? 'Sun' : 'Moon', size: 17 })))),
    h('main', { className: 'main', ref: mainRef }, h('div', { key: tab, className: 'view' }, view)),
    overlay ? h('div', { className: 'overlay', role: 'status', 'aria-live': 'polite' },
      h('div', { className: 'overlay-card' },
        h('div', { className: 'overlay-spin' }, h(Icon, { n: ['LoaderCircle', 'Loader2'], size: 26, className: 'spin' })),
        h('div', { className: 'font-semibold text-lg mt-3' }, 'Submitting to n8n'),
        h('ul', { className: 'overlay-steps' }, steps.map(function (s, i) {
          const st = overlay > i + 1 ? 'done' : overlay === i + 1 ? 'run' : 'wait';
          return h('li', { key: s, className: 'ostep ostep-' + st },
            h('span', { className: 'ostep-ico' }, st === 'done' ? h(Icon, { n: 'Check', size: 11, sw: 3 }) : null), s);
        })))) : null);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));

</script>
</body>
